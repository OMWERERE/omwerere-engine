[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omwerere-engine"
version = "0.1.0"
description = "Shared spine for Omwerere tributaries: Trivium scoring, hash-chained audit log, receipts"
requires-python = ">=3.10"
dependencies = []
license = { text = "Proprietary - all rights reserved (licence to be decided)" }

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
